<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raytone · 24% 眼睛动画预览</title>
  <link rel="stylesheet" href="../../src/avatars/raytoneAvatar.css">
  <style>
    * { box-sizing:border-box; } body { margin:0;background:#fff;color:#0c2458;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
    main { max-width:1120px;margin:44px auto;padding:0 28px; }
    h1 { margin:0 0 6px;font-size:25px;letter-spacing:-.03em; } p { margin:0;color:#737d8e; }
    .controls { display:flex;flex-wrap:wrap;align-items:center;gap:22px;margin:26px 0 12px;padding:16px 0;border-top:1px solid #e8ebf0;border-bottom:1px solid #e8ebf0; }
    fieldset { display:flex;gap:12px;margin:0;padding:0;border:0; } legend { float:left;margin-right:12px;color:#737d8e; }
    label { display:inline-flex;align-items:center;gap:6px;cursor:pointer; } input { accent-color:#0c2458; }
    select,button { color:#0c2458;background:white;border:1px solid #cfd6e1;border-radius:7px;padding:7px 10px;font:inherit; } button { cursor:pointer; }
    .grid { display:grid;grid-template-columns:repeat(3,1fr);gap:12px; }
    .person { text-align:center;min-width:0; } .stage { height:310px;display:flex;align-items:center;justify-content:center; }
    .stage .raytone-avatar { width:min(100%,310px);height:auto;aspect-ratio:1; }
    h2 { margin:0;font-size:18px;font-weight:550; } .sub { font-size:12px;margin-top:4px;color:#8790a0; }
    .small { margin:22px 0 0;min-height:86px;display:flex;align-items:center;justify-content:center;gap:15px; }
    .small .size-label { color:#8790a0;font-size:11px; }
    .bottom { display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;margin-top:30px;border-top:1px solid #e8ebf0;padding-top:18px;font-size:12px;color:#737d8e; }
    a { color:#0c2458;text-underline-offset:3px; }
    .raytone-avatar[data-paused="true"] * { animation-play-state:paused!important; }
    /* Large eyes already read as open; preserve clearance around brim, frames and mouth. */
    .raytone-avatar[data-state="listening"] .expression { transform:scale(1.04,1); }
    .raytone-avatar[data-state="asking"] .expression { transform:scale(1.08,1); }
    @media(max-width:650px) { main { margin:24px auto;padding:0 16px; } .controls { gap:12px; } .stage { height:auto;min-height:160px; } .small { flex-direction:column;gap:0; } h2 { font-size:15px; } .sub { font-size:10px; } }
    @media(prefers-reduced-motion:reduce) { .raytone-avatar * { animation:none!important;transition:none!important; } }
  </style>
</head>
<body>
<main>
  <h1>让眼神更容易被看见</h1>
  <p>默认眼高 24%，可在 23–25% 之间对比。镜框和帽子同步收回，保留浅肤色、细暖色描边与现有动效。</p>
  <div class="controls">
    <fieldset><legend>眼睛比例</legend><label><input type="radio" name="ratio" value="0.23">23%</label><label><input type="radio" name="ratio" value="0.24" checked>24%</label><label><input type="radio" name="ratio" value="0.25">25%</label></fieldset>
    <label>状态 <select id="state"><option value="idle">待机</option><option value="thinking">思考</option><option value="reading">阅读</option><option value="working">执行</option><option value="writing">回答</option><option value="asking">等待确认</option><option value="success">完成</option><option value="sleep">休息</option></select></label>
    <label><input id="autoplay" type="checkbox" checked>自动演示</label>
    <label><input id="halo" type="checkbox" checked>背景条纹</label>
    <button id="pause" type="button" aria-pressed="false">暂停</button>
  </div>
  <div class="grid" id="portraits"></div>
  <div class="bottom"><span>Tonny 恢复紧凑方框，留出眨眼和视线移动的空间。移动鼠标可以试视线跟随；拖一下头像会回弹。</span><a href="preview-24.gif" download>下载 24% 循环 GIF</a></div>
  <p class="sub" style="margin-top:12px">临时 SVG 动效稿 · 只写入 tmp/avatar-eye-study · 正式头像代码未修改</p>
</main>
<script type="module" src="./preview.mjs"></script>
</body></html>
