<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raytone Logo · 光栅调整</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #eceff3; font: 14px system-ui, sans-serif; color: #0c2458; }
  main { display: grid; gap: 16px; max-width: 720px; margin: auto; }
  figure { margin: 0; padding: 24px 32px; border-radius: 20px; background: #f7f9fb; }
  figcaption { margin-bottom: 16px; color: #58677d; }
  img { display: block; width: 560px; max-width: 100%; height: auto; }
  .dark { background: #1c1c1a; }
  .dark figcaption { color: #b7b4ab; }
  .small img { width: auto; height: 44px; }
</style>
<main>
  <figure><figcaption>调整前</figcaption><img src="before.svg" alt="原 Logo"></figure>
  <figure id="after"><figcaption>调整后</figcaption><img src="/brand/raytone-bot.svg?v=tapered-rays-v6" alt="增强粗细渐变与上下拖尾"></figure>
  <figure class="dark"><figcaption>深色版本</figcaption><img src="/brand/raytone-bot-dark.svg?v=tapered-rays-v6" alt="深色 Logo"></figure>
  <figure class="small"><figcaption>侧栏原尺寸</figcaption><img src="/brand/raytone-bot.svg?v=tapered-rays-v6" alt="44px 高度 Logo"></figure>
</main>
</html>
